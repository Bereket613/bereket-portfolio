# Render Blueprint — deploys the Express API web service.
# Apply it at: https://render.com/deploy?repo=https://github.com/Bereket613/bereket-portfolio
#
# When applying, Render will prompt you for DATABASE_URL:
#   Render Dashboard -> Postgres -> your database -> "Connections" tab ->
#   copy the "External Database URL" and paste it there.
#
# JWT_SECRET is generated automatically — no other input needed.

services:
  - type: web
    name: bereket-portfolio-api
    runtime: node
    rootDir: server
    plan: free
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false # paste your PostgreSQL "External Database URL" when prompted
      - key: JWT_SECRET
        generateValue: true
